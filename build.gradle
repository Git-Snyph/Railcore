plugins {
    id 'java'
    id 'application'
}

group = 'at.schmoegl'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// Bewusst ohne externe Abhängigkeiten: baut auch offline.
repositories { mavenCentral() }

application {
    mainClass = 'at.schmoegl.railcore.ui.App'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-serial']
}

// Kleiner eigener Testlauf (kein JUnit nötig): führt alle *Test-Klassen aus.
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Führt die Tests unter src/test aus.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'at.schmoegl.railcore.TestRunner'
}
tasks.named('check') { dependsOn 'selfTest' }
// Der Standard-Testtask (JUnit) fände keine Tests und schlüge seit Gradle 9 fehl.
tasks.named('test') { enabled = false }

jar {
    manifest { attributes 'Main-Class': application.mainClass }
}

// Z21-Prüfprogramm (Standard passiv, nur lesen). Beispiel:
//   gradlew z21Check --console=plain --args="--host 192.168.0.111 --dauer 60"
//   gradlew z21Check --console=plain --args="--host 192.168.0.111 --stufe aktiv"
tasks.register('z21Check', JavaExec) {
    group = 'application'
    description = 'Z21-Prüfprogramm: Fähigkeiten erkennen, offene Hardware-Fragen klären (--args="--hilfe").'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'at.schmoegl.railcore.z21.check.Z21CheckMain'
    standardInput = System.in
    workingDir = rootDir
}
